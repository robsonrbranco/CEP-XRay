# Configuracao do Firebird para o pod de consulta do CEP-XRay.
#
# Duas linhas, e as duas importam.

# Engine12 e o provider que roda o banco DENTRO do processo da aplicacao.
# Sem Remote e sem Loopback: o pod nao tem servidor, nao escuta na 3050 e nao
# aceita conexao de rede. Nao existe security3.fdb aqui -- embedded nao
# autentica, e por isso a credencial de fabrica do Firebird deixa de ser um
# risco mitigado e passa a nao existir.
Providers = Engine12

# Classic, nao Super. Em Super o engine toma lock exclusivo do arquivo no
# attach e o primeiro worker barra todos os outros -- medido em Linux, 1 de 4
# processos conectam. Com Classic, 4 de 4. Vale igual para base read-only: a
# variavel e o ServerMode, nao o modo de acesso.
ServerMode = Classic

# A base do pod nunca e escrita, entao nao ha lixo a varrer.
SweepInterval = 0
